<!DOCTYPE html>
<html lang="en" class="bg-gray-900 text-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculate Pay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style type="text/tailwindcss">
    .glass {
      backdrop-filter: blur(8px);
      background-color: rgba(31, 41, 55, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: 0 8px 32px 0 rgba(0,0,0,.18);
    }
    .ledgr-header { @apply w-full max-w-2xl mx-auto px-4 pt-7 pb-5 flex items-center justify-between; }
    .ledgr-logo { @apply text-2xl font-black tracking-tight select-none flex items-center; }
    .ledgr-nav { @apply flex gap-3 items-center; }
    .nav-btn { @apply bg-gray-800/70 hover:bg-gray-700 text-white/80 hover:text-green-400 transition rounded-xl px-5 h-12 flex items-center font-semibold text-base shadow border border-gray-700 justify-center; }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-950 to-gray-900 min-h-screen font-sans">
  <header class="ledgr-header">
    <span class="ledgr-logo">
      <svg width="28" height="28" fill="none" class="mr-2"><rect width="100%" height="100%" rx="8" fill="#22c55e"/><text x="8" y="20" font-family="Arial" font-size="16" fill="#fff" font-weight="bold">L</text></svg>
      Ledgr
    </span>
    <nav class="ledgr-nav">
      <a href="index.html" class="nav-btn">Home</a>
      <a href="calculate.html" class="nav-btn">Calculator</a>
      <a href="employees.html" class="nav-btn">Employees</a>
      <a href="payslip.html" class="nav-btn">Payslip</a>
    </nav>
  </header>
  <main class="w-full max-w-2xl mx-auto px-4 fade-in">
    <div class="glass rounded-2xl p-6 mt-4">
      <h1 class="text-3xl font-bold mb-4 text-center">Calculate Pay</h1>
      <div class="space-y-4">
        <label class="block">Employee
          <select id="employee" onchange="selectEmployee()" class="mt-1 w-full bg-gray-800 border-gray-700 rounded p-2"></select>
        </label>
        <label class="block">Hours worked
          <input type="number" id="hours" class="mt-1 w-full bg-gray-800 border-gray-700 rounded p-2" />
        </label>
        <label class="block">Hourly rate ($)
          <input type="number" id="rate" class="mt-1 w-full bg-gray-800 border-gray-700 rounded p-2" />
        </label>
        <button onclick="calculate()" class="bg-blue-600 hover:bg-blue-700 rounded px-4 py-2">Calculate</button>
      </div>
      <div class="mt-6 space-y-1">
        <p>Gross Pay: $<span id="gross">0.00</span></p>
        <p>PAYE Tax (20%): $<span id="tax">0.00</span></p>
        <p>Net Pay: $<span id="net">0.00</span></p>
      </div>
    </div>
  </main>
  <footer class="text-center text-gray-500 py-6">&copy; 2024 Ledgr Payroll</footer>
  <script>
    const defaultEmployees = [
      {name: 'John Doe', position: 'Developer', rate: 35},
      {name: 'Jane Smith', position: 'Designer', rate: 30}
    ];
    let employees = JSON.parse(localStorage.getItem('employees')) || defaultEmployees;

    function populateEmployees(){
      const sel = document.getElementById('employee');
      sel.innerHTML = '<option value="">Select</option>';
      employees.forEach((emp,i)=>{
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${emp.name} - ${emp.position}`;
        sel.appendChild(opt);
      });
    }
    function selectEmployee(){
      const idx = document.getElementById('employee').value;
      if(idx !== ''){
        document.getElementById('rate').value = employees[idx].rate;
      }
    }
    function calculate(){
      const hours = parseFloat(document.getElementById('hours').value)||0;
      const rate = parseFloat(document.getElementById('rate').value)||0;
      const gross = hours * rate;
      const tax = gross * 0.2;
      const net = gross - tax;
      document.getElementById('gross').textContent = gross.toFixed(2);
      document.getElementById('tax').textContent = tax.toFixed(2);
      document.getElementById('net').textContent = net.toFixed(2);
    }
    document.addEventListener('DOMContentLoaded', populateEmployees);
  </script>
</body>
</html>
